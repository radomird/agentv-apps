<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>HBO Max stand-in: signed out</title>
<!-- A stand-in for HBO Max's start page when you're signed out, made by hand,
     with only its Sign In links. -->
<style>
  body { margin: 0; background: #000; color: #eee; font: 24px sans-serif; }
  header { display: flex; gap: 24px; padding: 24px 48px; }
  header a { color: #eee; }
</style>
<body>
  <header>
    <a id="header-logo" href="/nl/en" aria-label="Start">Start</a>
    <a id="header-secondary-cta-default" href="/auth/login">Sign In</a>
    <a id="header-primary-cta-default" href="/product">Sign Up Now</a>
  </header>
</body>
</html>
