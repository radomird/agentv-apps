<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Jellyfin</title>
<!-- The stand-in for Jellyfin's web app, signed in as in home.html, with its
     player playing: a video of a test pattern, made with ffmpeg for this. -->
<script>
  localStorage.setItem("jellyfin_credentials", JSON.stringify({
    Servers: [{
      Id: "00000000000000000000000000000001",
      Name: "fixtures",
      ManualAddress: "http://jellyfin.test:8096",
      UserId: "00000000000000000000000000000002",
      AccessToken: "fixture-token",
      DateLastAccessed: 1761400000000
    }]
  }));
  localStorage.setItem("_deviceId2", "fixtures-web");
</script>
<body>
  <video src="/web/test-pattern.webm" autoplay muted loop playsinline></video>
  <!-- Playing from the start, as a player that has been told to play is,
       before the first frame has come. -->
  <script>
    document.querySelector("video").play();
  </script>
</body>
</html>
